spin_manifest_version = 2

[application]
name = "spin-outbound-repro"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "app"

[component.app]
source = "app.wasm"
allowed_outbound_hosts = ["https://example.com"]

[component.app.build]
command = "componentize-py -w spin-http componentize app -o app.wasm"
